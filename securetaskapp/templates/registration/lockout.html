{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <h1 class="display-1 text-danger">🔒</h1>
                    <h2 class="mb-3">Account Locked</h2>
                    <p class="text-muted mb-4">Too many failed login attempts. Your account has been temporarily locked for security reasons.</p>
                    <p class="text-muted">Please try again in <strong>2 minutes</strong>.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary mt-3">Try Again Later</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
